name: ctrim_app
description: A new Flutter project.

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

# version: 0.4.1+6 # iOS
version: 0.5.0+6 # Android

environment:
  sdk: '>=3.0.2 <4.0.0'

dependencies:
  # chewie: ^1.5.0
  add_2_calendar: ^2.2.4
  avatar_stack: ^1.2.0
  cloud_firestore: ^4.8.1
  cloud_functions: ^4.3.4
  firebase_analytics: ^10.4.4
  firebase_auth: ^4.7.0
  firebase_core: ^2.13.1
  firebase_messaging: ^14.6.5
  firebase_messaging_web: ^3.5.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^7.4.1
  flutter_quill_extensions: ^0.4.1
  http: ^0.13.6
  intl: ^0.18.0
  package_info_plus: ^4.1.0
  path_provider: ^2.0.15
  photo_view: ^0.14.0
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  url_launcher: ^6.1.12
  video_player: ^2.6.1
  video_thumbnail: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
