# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: CTRIM Community
site_description: Product overview for CTRIM Community stakeholders
site_url: https://deigoc.github.io/ctrim_app/

# Only publish audience-facing docs — never agent handoffs under docs/*.md
docs_dir: docs/stakeholders

# Livereload: custom_dir is outside docs_dir
watch:
  - docs/stakeholders
  - docs/stakeholders-theme

repo_url: https://github.com/DeigoC/ctrim_app
repo_name: DeigoC/ctrim_app
edit_uri: edit/main/docs/stakeholders/

theme:
  name: material
  custom_dir: docs/stakeholders-theme
  language: en
  font:
    text: DM Sans
    code: Roboto Mono
  icon:
    logo: material/account-group
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

# Keep GitHub-only / agent notes out of the published site
exclude_docs: |
  README.md

# Authoring aids — built, but not in the public nav
not_in_nav: |
  /how-to/screenshot-checklist.md

nav:
  - Home: index.md
  - Product overview: overview.md
  - Key concepts: key-concepts.md
  - Features:
    - Events & bulletin: events-and-bulletin.md
    - Personal: personal.md
    - Information: information.md
    - Cell Groups: cell-groups.md
    - People & roles: people-and-roles.md
    - Notifications: notifications.md
    - Platforms: platforms.md
  - How-to guides:
    - how-to/index.md
    - Posts:
      - Create a post: how-to/posts/create-a-post.md
      - Edit a post: how-to/posts/edit-a-post.md
    - Information:
      - Add or edit Information: how-to/information/add-or-edit-information.md
    - People:
      - Register or edit people: how-to/people/register-or-edit-users.md
    - Using images & video: how-to/media.md
  - Roadmap & priorities: roadmap.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DeigoC/ctrim_app

copyright: CTRIM Community — an open passion project
