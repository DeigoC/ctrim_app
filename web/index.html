<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0175C2">
  <meta name="description" content="The Official App for CTRIM - currently a Work in Progress! Please download the app in iOS and Android">

  <!-- Inline splash — paints before Flutter/JS loads -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #0175C2;
    }
    #flutter-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0175C2;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #flutter-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #flutter-splash img {
      width: 96px;
      height: 96px;
      border-radius: 20px;
    }
    #flutter-splash p {
      margin: 16px 0 0;
      color: rgba(255, 255, 255, 0.9);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      letter-spacing: 0.02em;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CTRIM App">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.ico" />

  <title>CTRIM App</title>
  <link rel="manifest" href="manifest.json">

  <script src="pwa_install.js"></script>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>

  <!-- Firebase SDK for Web -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-check-compat.js"></script>
  
  <!-- Firebase App Check Debug Token (for local development) -->
  <script>
    // Enable App Check debug token in development
    // This will print a debug token in the console that you need to add to Firebase Console
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      window.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
      console.log('🔧 Firebase App Check Debug Mode enabled');
      console.log('📋 Look for the debug token in the console below and add it to Firebase Console');
    }
  </script>
</head>

<body>
  <div id="flutter-splash" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
    <p>CTRIM App</p>
  </div>

  <script>
    function removeFlutterSplash() {
      var splash = document.getElementById('flutter-splash');
      if (!splash) return;
      splash.classList.add('fade-out');
      splash.addEventListener('transitionend', function () { splash.remove(); });
    }
    window.addEventListener('flutter-first-frame', removeFlutterSplash);

    console.log('🚀 Starting CTRIM App...');

    window.addEventListener('load', function(ev) {
      console.log('📱 Window loaded, initializing Flutter...');
      
      // Register Firebase Service Worker (non-blocking)
      if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then((registration) => {
            console.log('✅ Firebase SW registered:', registration.scope);
          })
          .catch((error) => {
            console.warn('⚠️ Firebase SW registration failed:', error);
          });
      }

      // Wait for _flutter to be available
      var checkFlutter = setInterval(function() {
        if (window._flutter) {
          clearInterval(checkFlutter);
          console.log('🔧 Flutter loaded, initializing...');
          
          // Initialize Flutter
          _flutter.loader.loadEntrypoint({
            onEntrypointLoaded: function(engineInitializer) {
              console.log('🔧 Flutter entrypoint loaded');
              engineInitializer.initializeEngine().then(function(appRunner) {
                console.log('✨ Running Flutter app...');
                appRunner.runApp();
              });
            }
          });
        }
      }, 50);
    });
  </script>
</body>
</html>
