<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The Official App for CTRIM - currently a Work in Progress! Please download the app in iOS and Android">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CTRIM App">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.ico" />

  <title>CTRIM App</title>
  <link rel="manifest" href="manifest.json">

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>

  <!-- Firebase SDK for Web -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
</head>

<body>
  <script>
    console.log('🚀 Starting CTRIM App...');

    window.addEventListener('load', function(ev) {
      console.log('📱 Window loaded, initializing Flutter...');
      
      // Register Firebase Service Worker (non-blocking)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then((registration) => {
            console.log('✅ Firebase SW registered:', registration.scope);
          })
          .catch((error) => {
            console.warn('⚠️ Firebase SW registration failed:', error);
          });
      }

      // Initialize Flutter
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}}
        },
        onEntrypointLoaded: function(engineInitializer) {
          console.log('🔧 Flutter entrypoint loaded');
          engineInitializer.initializeEngine().then(function(appRunner) {
            console.log('✨ Running Flutter app...');
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
