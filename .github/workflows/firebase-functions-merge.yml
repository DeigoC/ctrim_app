# Deploy Cloud Functions to production when function code merges to main.
# PRs run unit tests only (.github/workflows/unit-tests.yml); this job deploys after merge.

name: Deploy Cloud Functions on merge

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/firebase-functions-merge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match functions runtime in firebase.json (python313).
          python-version: "3.13"
          cache: pip
          cache-dependency-path: functions/requirements.txt

      - name: Install function dependencies
        working-directory: functions
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CTRIM_APP }}

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project ctrim-app --non-interactive
