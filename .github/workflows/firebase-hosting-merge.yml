# Auto-generated by Firebase CLI, updated to install Flutter before building.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to match local SDK. flutter_quill 11.5.0 breaks on 3.44+;
          # 11.5.1 requires Flutter >=3.44, so bump both together later.
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Build web
        run: flutter pub get && flutter build web --release

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CTRIM_APP }}
          channelId: live
          projectId: ctrim-app
