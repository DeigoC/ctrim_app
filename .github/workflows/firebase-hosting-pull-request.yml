# Auto-generated by Firebase CLI, updated to install Flutter before building.
# Deploys a temporary Hosting preview channel and comments the URL on the PR.

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to match local SDK. flutter_quill 11.5.0 breaks on 3.44+;
          # 11.5.1 requires Flutter >=3.44, so bump both together later.
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Build web
        run: flutter pub get && flutter build web --release

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CTRIM_APP }}
          projectId: ctrim-app
